# Local PostgreSQL only. Railway uses its own private PostgreSQL service/volume.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: shopora_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong local database owner password}
      POSTGRES_DB: shopora
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - shopora_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shopora_owner -d shopora"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  shopora_postgres:
