name: Build Shopora Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['mobile-android/**', '.github/workflows/android.yml']
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build and lint
        working-directory: mobile-android
        run: gradle assembleDebug lintDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Shopora-Android-APK
          path: mobile-android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-lint-report
          path: mobile-android/app/build/reports/lint-results-debug.html
